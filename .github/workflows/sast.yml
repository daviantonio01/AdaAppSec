# .github/workflows/semgrep.yml
name: Semgrep CE scan
on:
  pull_request: {}
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto
